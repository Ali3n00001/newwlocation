<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kingston</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button class="scene-trigger" type="button" aria-label="Enter the resting garden scene">
    <span class="bench-hover" aria-hidden="true"></span>
  </button>
  <button class="path-trigger" type="button" aria-label="Return to the Garden Default scene"></button>
  <div class="left-controls">
    <button class="artwork-trigger clock-trigger" type="button" aria-label="Toggle compass animation" aria-pressed="false">
      <img src="animation/37578 copy.png" alt="">
    </button>
    <button class="artwork-trigger glasses-trigger" type="button" aria-label="Play the hand animation">
      <img src="animation/37578 copy1.png" alt="">
    </button>
    <img class="inventory-image" src="animation/inventory (2).jpg" alt="Inventory">
  </div>

  <main>
    <img class="artwork" src="animation/37570 copy.png" alt="Two hands holding a pair of glasses">
  </main>
  <img class="bottom-artwork" src="animation/37570 copy 2.png" alt="Two hands reaching toward each other">
  <img class="compass-artwork" src="animation/37577 copy.png" alt="" aria-hidden="true">
  <div class="scene-transition" aria-hidden="true"></div>


  <script src="script.js"></script>
</body>
</html>
